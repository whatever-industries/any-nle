[package]
name = "anynle-resolve-adapter"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
avid-reader = { path = "../../avid-reader" }
anynle-avid-adapter = { path = "../avid-adapter" }
anynle-graph = { path = "../graph" }
prproj = { path = "../../prproj" }
flate2 = "1"
hex = "0.4.3"
quick-xml = "0.41"
regex = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4.6", default-features = false, features = ["deflate"] }
zstd = "0.13"
